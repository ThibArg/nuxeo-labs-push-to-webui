<link rel="import" href="nuxeo-labs-push-listener.html">

<!--
  Register the push listener in DOCUMENT_ACTIONS slot so it is always present
  when a document is displayed. The element has no visible UI; it only listens
  for SSE events and dispatches toast notifications.
-->
<nuxeo-slot-content name="pushNotificationListener" slot="DOCUMENT_ACTIONS" order="999">
  <template>
    <nuxeo-labs-push-listener></nuxeo-labs-push-listener>
  </template>
</nuxeo-slot-content>
